plugins {
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url 'https://repo.lemaik.de/'
    }
}

java {
    // Chunky 2.5 requires Java 17
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

configurations {
    implementation.extendsFrom(provided)
    implementation.extendsFrom(bundled)
}

dependencies {
    // With -PchunkyDir=<path to a Chunky checkout> these are built from that checkout (see settings.gradle)
    // instead of the published 2.5.0-SNAPSHOT.
    provided 'se.llbit:chunky-core:2.5.0-SNAPSHOT'
    if (findProperty('chunkyDir') != null) {
        // chunky-core only depends on its lib project internally; the published jar bundles it.
        provided 'se.llbit:chunky-lib:2.5.0-SNAPSHOT'
    }
    provided 'org.apache.commons:commons-math3:3.2'
    provided 'it.unimi.dsi:fastutil:8.4.4'
    bundled 'org.jocl:jocl:2.0.6'
}

javafx {
    version = '17'
    modules = ['javafx.base', 'javafx.controls', 'javafx.fxml']
    configuration = 'provided'
}

processResources {
    from "src/main/opencl/kernel/include", { into "kernel" }
    from "src/main/opencl/tonemap/include", { into "tonemap" }
}

jar {
    from {
        configurations.bundled.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // License of this plugin and of the libraries bundled into the jar (JOCL)
    from('LICENSE') { into 'META-INF' }
    from('licenses') { into 'META-INF/licenses' }
}

defaultTasks 'jar'
