plugins {
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url 'https://repo.lemaik.de/'
    }
}

// Keep in sync with src/main/resources/plugin.json
version = '0.6.0'
base {
    archivesName = 'chunky-diversity'
}

java {
    // Chunky 2.5 requires Java 17
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

configurations {
    implementation.extendsFrom(provided)
    implementation.extendsFrom(bundled)
}

dependencies {
    // With -PchunkyDir=<path to a Chunky checkout> these are built from that checkout (see settings.gradle)
    // instead of the published 2.5.0-SNAPSHOT.
    provided 'se.llbit:chunky-core:2.5.0-SNAPSHOT'
    if (findProperty('chunkyDir') != null) {
        // chunky-core only depends on its lib project internally; the published jar bundles it.
        provided 'se.llbit:chunky-lib:2.5.0-SNAPSHOT'
    }
    provided 'org.apache.commons:commons-math3:3.2'
    provided 'it.unimi.dsi:fastutil:8.4.4'
    bundled 'org.jocl:jocl:2.0.6'
}

javafx {
    version = '17'
    modules = ['javafx.base', 'javafx.controls', 'javafx.fxml']
    configuration = 'provided'
}

// Metal backend: JNI bridge in src/main/native, built with clang on macOS only. On other systems
// the jar has no bridge library and the Metal renderer is not registered.
def jniHeaderDir = layout.buildDirectory.dir('generated/jni')
def metalBridgeDir = layout.buildDirectory.dir('native')
def isMac = System.getProperty('os.name').toLowerCase().contains('mac')

tasks.named('compileJava') {
    options.headerOutputDirectory = jniHeaderDir
}

tasks.register('metalBridge', Exec) {
    onlyIf { isMac }
    dependsOn 'compileJava'
    def source = file('src/main/native/metal_bridge.m')
    def output = metalBridgeDir.map { it.file('native/libchunkymetal.dylib') }
    def javaHome = System.getProperty('java.home')
    inputs.file source
    inputs.dir jniHeaderDir
    outputs.file output
    doFirst { output.get().asFile.parentFile.mkdirs() }
    commandLine 'clang', '-fobjc-arc', '-dynamiclib', '-O2', '-Wall', '-Werror',
            '-arch', 'arm64', '-arch', 'x86_64', '-mmacosx-version-min=11.0',
            "-I${javaHome}/include", "-I${javaHome}/include/darwin", "-I${jniHeaderDir.get().asFile}",
            '-framework', 'Foundation', '-framework', 'Metal',
            source.path, '-o', output.get().asFile.path
}

processResources {
    dependsOn 'metalBridge'
    from metalBridgeDir
    from "src/main/opencl/kernel/include", { into "kernel" }
    from "src/main/opencl/tonemap/include", { into "tonemap" }
}

jar {
    from {
        configurations.bundled.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // License of this plugin and of the libraries bundled into the jar (JOCL)
    from('LICENSE') { into 'META-INF' }
    from('licenses') { into 'META-INF/licenses' }
}

defaultTasks 'jar'
